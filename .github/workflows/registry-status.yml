name: Check Ultra Image + PiD Registry status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/registry-status.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Registry status without publisher credentials
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.comfy.org/nodes/comfyui-ultra-image-pid/versions?include_status_reason=true"
          req = urllib.request.Request(url, headers={"User-Agent": "Ultra-Image-PiD-Registry-Audit/1.0.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          versions = payload if isinstance(payload, list) else payload.get("versions", payload.get("items", []))
          if not isinstance(versions, list):
              raise SystemExit("Registry returned an unexpected version list")
          print("Registry versions:", len(versions))
          for item in versions:
              print("VERSION", item.get("version"), "STATUS", item.get("status"),
                    "EXTRACTION", item.get("comfy_node_extract_status"),
                    "REASON", str(item.get("status_reason", ""))[:800])
          match = [v for v in versions if str(v.get("version")) == "1.0.0"]
          if not match:
              raise SystemExit("1.0.0 is not yet present in the Registry version list")
          print("V1_STATUS", match[0].get("status"))
          PY
